[project]
name = "agentic-rag-customer-service-system"
version = "0.1.0"
description = "Agentic RAG Customer Service System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.10",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",
    "chromadb>=0.4.20",
    "sentence-transformers>=2.3.0",
    "streamlit>=1.30.0",
    "guardrails-ai>=0.4.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
